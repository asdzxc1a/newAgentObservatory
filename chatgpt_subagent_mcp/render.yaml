services:
  - type: web
    name: chatgpt-native-subagent-primitive
    runtime: python
    plan: free
    rootDir: chatgpt_subagent_mcp
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: ENABLE_HOSTED_MULTI_AGENT
        value: "1"
      - key: MAX_SUBAGENTS
        value: "8"
