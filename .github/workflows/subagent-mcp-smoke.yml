name: subagent-mcp-smoke

on:
  push:
    branches: [chatgpt-native-subagents]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt_subagent_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m py_compile server.py smoke_test.py
      - run: python smoke_test.py
